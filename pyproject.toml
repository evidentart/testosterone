[build-system]
requires = ["hatchling>=1.27.0", "hatch-fancy-pypi-readme>=24.1.0"]
build-backend = "hatchling.build"

[project]
name = "testo-core"
version = "1.1.1"
description = "See what broke, what's flaky and what got slower on every run: test history, run-to-run diffs and flaky detection for pytest, Playwright, Jest or any JUnit-writing runner."
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Taltal", email = "ttlgptinc@gmail.com" }]
keywords = [
    "testing",
    "flaky-tests",
    "test-history",
    "test-analytics",
    "test-orchestration",
    "pytest",
    "behave",
    "bdd",
    "allure",
    "junit",
    "ci",
    "test-reporting",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# Lean runtime: only what `testo run` and `testo report` strictly need.
# Run history is always saved (SQLite by default), so sqlmodel is core; database
# drivers other than SQLite, the API and metrics live in extras groups below.
dependencies = [
    "python-dotenv>=1.0.0",
    "sqlmodel>=0.0.24",
    "requests>=2.32.0",
    "allure-pytest>=2.15.0",
    "allure-python-commons>=2.15.0",
    "PyYAML>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "watchdog>=4.0.0",
    "Jinja2>=3.1.0",
]

[project.scripts]
testo = "testo_core.cli.app:main"
testo-api = "testo_api.main:run"

[project.optional-dependencies]
# Behave and BehaveX stages (`equipment: behave` / `behavex`) and their Allure formatter.
# Optional since 1.2: pytest, Playwright, `command` and `testo ingest` don't need them.
bdd = [
    "behave>=1.3.0,<2",
    "behavex>=4.6.0",
    "allure-behave>=2.15.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.9.0",
]
db = [
    "psycopg[binary]>=3.2.0",
    "tomli-w>=1.0.0",
]
db_mysql = [
    "pymysql>=1.1.0",
]
metrics = [
    "matplotlib>=3.10.0",
    "influxdb-client>=1.48.0",
]
# The docs site (mkdocs.yml). Material 9.x pins MkDocs below 2.0.
docs = [
    "mkdocs-material>=9.7,<10",
]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "jsonschema>=4.0.0",
    "build>=1.2.0",
    "ruff>=0.15.0",
    "mypy>=2.1.0",
    "pre-commit>=4.0.0",
    # The dev profile installs every extra so the test suite covers the full
    # surface area without needing per-test installs.
    "testo-core[api,bdd,db,metrics]",
]

[project.urls]
Homepage = "https://github.com/taltal-beep/testosterone"
Documentation = "https://github.com/taltal-beep/testosterone/wiki"
Demo = "https://taltal-beep.github.io/testosterone/"
Source = "https://github.com/taltal-beep/testosterone"
Issues = "https://github.com/taltal-beep/testosterone/issues"
Changelog = "https://github.com/taltal-beep/testosterone/blob/main/CHANGELOG.md"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI renders the README without the repository around it, so relative image
# and link targets would break there. Images go to raw GitHub URLs first; the
# last rule then points every remaining relative link at the file on GitHub.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/taltal-beep/testosterone/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/taltal-beep/testosterone/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#)([^"]+)"'
replacement = 'href="https://github.com/taltal-beep/testosterone/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)\s]+)\)'
replacement = '](https://github.com/taltal-beep/testosterone/blob/main/\1)'

# The sdist carries what is needed to build and test the Python package; the
# frontend, docs vault and CI wrappers stay in the repository.
[tool.hatch.build.targets.sdist]
include = [
    "/testo_core",
    "/testo_api",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pytest.ini",
]

[tool.hatch.build.targets.wheel]
packages = ["testo_core", "testo_api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Started as pyflakes (F) + a subset of pycodestyle (E) + import sorting (I);
# extended with pyupgrade (UP) and bugbear (B). Line-length (E501) is ignored:
# `ruff format` (blocking in CI) wraps code, and the lines it leaves long are
# strings and comments it deliberately does not split.
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # Typer/FastAPI both use `Depends(...)`/`typer.Option(...)` as default-arg values —
    # the idiomatic pattern for both frameworks, used throughout testo_api and the CLI.
    "B008",
    # `class Foo(str, Enum)` -> `enum.StrEnum` is a real behavior-adjacent change
    # (repr/serialization edge cases) affecting enums used pervasively (RunStatus,
    # EngineExitCode); deserves its own tested PR, not a lint-config side effect.
    "UP042",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
