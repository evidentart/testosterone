stages:
  - quality

variables:
  TESTO_CONFIG_PATH: ""
  TESTO_CYCLE: ""
  TESTO_PERSIST: "true"
  TESTO_PACKAGE: "testo-core"  # e.g. "testo-core[bdd]" for Behave stages, "testo-core==1.2.0"

testo_run:
  stage: quality
  image: python:3.11-slim
  script:
    - python -m pip install --upgrade pip
    - python -m pip install "$TESTO_PACKAGE"
    - |
      TESTO_ARGS=(run --ci)
      if [ -n "$TESTO_CONFIG_PATH" ]; then
        TESTO_ARGS+=(--config "$TESTO_CONFIG_PATH")
      fi
      if [ -n "$TESTO_CYCLE" ]; then
        TESTO_ARGS+=(--cycle "$TESTO_CYCLE")
      fi
      if [ "$TESTO_PERSIST" = "false" ]; then
        TESTO_ARGS+=(--no-persist)
      fi
      set -o pipefail
      testo "${TESTO_ARGS[@]}" | tee testo-output.ndjson
  after_script:
    - grep '"event":"plan_finished"' testo-output.ndjson | tail -n 1 > testo-summary.json || true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - testo-output.ndjson
      - testo-summary.json
