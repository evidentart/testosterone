name: Testosterone Run
description: Run a Testosterone cycle via `testo run --ci`.
inputs:
  config-path:
    description: Path to testosterone.yaml (empty = discovery from the workspace root).
    required: false
    default: ""
  cycle:
    description: Cycle to run (empty = the only cycle in the config; `all` = every cycle).
    required: false
    default: ""
  ci-mode:
    description: Emit NDJSON events on stdout (`testo run --ci`).
    required: false
    default: "true"
  persist:
    description: Persist plan_result.json and the run history record.
    required: false
    default: "true"
  python-version:
    description: Python version used to run testo.
    required: false
    default: "3.11"
  package:
    description: What to pip install for testo, e.g. `testo-core==1.2.0`, or `.` for a checkout of this repository.
    required: false
    default: testo-core
  job-summary:
    description: Write the run (results, failing tests, changes since the last run) to the job summary.
    required: false
    default: "true"
  comment-on-pr:
    description: "On pull_request events, keep one comment per cycle on the pull request with the same summary. Needs `permissions: pull-requests: write`."
    required: false
    default: "false"
  annotations:
    description: Print failing tests as annotations, shown inline on the pull request diff. Needs no permission.
    required: false
    default: "true"
  slack-webhook:
    description: "Slack incoming-webhook URL. Pass a repository secret (secrets.SLACK_WEBHOOK_URL); empty = no Slack alert."
    required: false
    default: ""
  teams-webhook:
    description: "Microsoft Teams Workflows webhook URL. Pass a secret; empty = no Teams alert."
    required: false
    default: ""
  notify-when:
    description: "When to send the chat alert: `failure` (red run or newly flaky test), `change` (differs from the previous run) or `always`."
    required: false
    default: failure
  flaky-issues:
    description: "Open one issue per test that this run made flaky (skipped if an open issue has the same title). Needs `permissions: issues: write`."
    required: false
    default: "false"
  github-token:
    description: Token used for the pull request comment and flaky test issues.
    required: false
    default: ${{ github.token }}
outputs:
  exit_code:
    description: testo process exit code.
    value: ${{ steps.run_testo.outputs.exit_code }}
  summary_json:
    description: Final `plan_finished` (or `error`) NDJSON event as a JSON string.
    value: ${{ steps.run_testo.outputs.summary_json }}
  summary_path:
    description: Absolute path to the saved summary JSON file.
    value: ${{ steps.run_testo.outputs.summary_path }}
  status:
    description: Normalized status string from exit code.
    value: ${{ steps.run_testo.outputs.status }}
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install testo
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ inputs.package }}"
    - name: Run testo
      id: run_testo
      shell: bash
      env:
        TESTO_GITHUB_TOKEN: ${{ inputs.github-token }}
        TESTO_SLACK_WEBHOOK_URL: ${{ inputs.slack-webhook }}
        TESTO_TEAMS_WEBHOOK_URL: ${{ inputs.teams-webhook }}
      run: |
        python "${{ github.action_path }}/run_testo_action.py" \
          --config-path "${{ inputs.config-path }}" \
          --cycle "${{ inputs.cycle }}" \
          --ci-mode "${{ inputs.ci-mode }}" \
          --persist "${{ inputs.persist }}" \
          --job-summary "${{ inputs.job-summary }}" \
          --comment-on-pr "${{ inputs.comment-on-pr }}" \
          --annotations "${{ inputs.annotations }}" \
          --notify-when "${{ inputs.notify-when }}" \
          --flaky-issues "${{ inputs.flaky-issues }}"
