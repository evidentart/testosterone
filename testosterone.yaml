# yaml-language-server: $schema=schema/testosterone.schema.json
version: 1
database:
  url: sqlite:////tmp/testo-reports.db
defaults:
  target_repo: .
  artifacts_root: artifacts
  timeout_s: 600
  workers: 4
reporters:
  - type: allure
cycles:
  sample-pytests:
    description: Pytest suite for the sample target repo (regular pytest + Allure).
    stages:
      - name: pytest-sample
        equipment: pytest
        target_repo: sample_target_repo
        args:
          - -q
          - tests

  sample-behave:
    description: Native Behave + Allure against sample target features/.
    stages:
      - name: behave-features
        equipment: behave
        target_repo: sample_target_repo
        args:
          - features

  behavex-flow-tests:
    description: Run all Behave-based flow tests with BehaveX.
    stages:
      - name: flow-tests
        equipment: behavex
        target_repo: sample_target_repo
        args:
          - features

  sample-all-frameworks:
    description: Run pytest, native Behave, then BehaveX on the sample target in one cycle.
    stages:
      - name: pytest-sample
        equipment: pytest
        target_repo: sample_target_repo
        args:
          - -q
          - tests
      - name: behave-features
        equipment: behave
        target_repo: sample_target_repo
        args:
          - features
      - name: flow-tests
        equipment: behavex
        target_repo: sample_target_repo
        args:
          - features

  # --- GitLab Pages demo (.gitlab-ci.yml) ------------------------------------
  # Testosterone running its own Python suite, split by tier so the dashboard's
  # pyramid is real. The nested pytest gets its own throwaway DB so the suite's
  # tests never write into the history of the run that is executing them.
  self-test:
    description: Testosterone's own fast suite, run by testosterone.
    stages:
      - name: core-unit
        equipment: pytest
        target_repo: .
        args: ["-q", "-p", "no:cacheprovider", "--no-cov", "-m", "unit and tier_fast and not quarantined", "tests"]
        tier: unit
        extra_env:
          DATABASE_URL: "sqlite:////tmp/testo-self-test.db"
      - name: core-integration
        equipment: pytest
        target_repo: .
        args: ["-q", "-p", "no:cacheprovider", "--no-cov", "-m", "(integration or contract) and tier_fast and not quarantined", "tests"]
        tier: integration
        extra_env:
          DATABASE_URL: "sqlite:////tmp/testo-self-test.db"

  # The demo target: https://github.com/taltal-beep/fake-api, cloned into
  # .demo/fake-api by the pipeline. Its failures are built into the app
  # (a flaky route, a broken one, a slow one), not injected into the tests.
  fake-api:
    description: Fake Doing Bullshit app (taltal-beep/fake-api) — unit, API, Behave and browser tests.
    stages:
      - name: unit
        equipment: pytest
        target_repo: .demo/fake-api
        args: ["-q", "-p", "no:cacheprovider", "tests/unit"]
        tier: unit
      - name: api
        equipment: pytest
        target_repo: .demo/fake-api
        args: ["-q", "-p", "no:cacheprovider", "tests/api"]
        tier: integration
      - name: buttons
        equipment: behave
        target_repo: .demo/fake-api
        args: ["features/buttons.feature"]
        tier: integration
      - name: ui
        equipment: pytest
        target_repo: .demo/fake-api
        args: ["-q", "-p", "no:cacheprovider", "tests/e2e"]
        tier: e2e
