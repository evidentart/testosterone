name: ci

# Unified CI/CD pipeline: format -> test -> deploy
#
# Stages:
#   format               ruff lint + ruff format check + mypy on testo_core and testo_api (all blocking)
#   test                 fast required pytest suite with the coverage gate (folds in
#                        the old pr-fast workflow); uploads coverage.xml
#   frontend             React dashboard: typecheck, generated API types up to date,
#                        vitest unit tests, production build
#   changelog_required    PR-only: fails if non-doc changes don't touch CHANGELOG.md
#                          (escape hatch: 'no-changelog' PR label)
#   docs_vault           lints the docs/ vault against docs/CLAUDE.md (frontmatter,
#                        links, orphans; on PRs also the `updated` date)
#   docs_site            builds the MkDocs site from docs/ with --strict (broken links fail)
#   getting_started      runs examples/getting-started through the GitHub Action, the
#                        way docs/Getting Started.md tells a new user to
#   github_action        runs this checkout's code through the GitHub Action and, on
#                        pull requests, posts its run summary as a PR comment
#   package              builds the sdist and wheel, `twine check --strict`, then installs
#                        the wheel with no extras and runs a cycle (scripts/package_smoke.sh)
#   deploy               builds the distributable wheel on a published release
#
# Code review is handled by a local pre-push hook (.claude/settings.json),
# not by CI -- see 990be121 for why the earlier CI-based review was dropped.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  push:
    branches: [main]
  release:
    types: [published]

# Cancel superseded runs on the same ref so we never pay for stale test runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # mypy needs the real dependencies (SQLModel, Rich, FastAPI, ...) to
      # check against their types instead of treating them as Any.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format check
        run: ruff format --check --diff .
      - name: mypy
        run: mypy testo_core testo_api

  test:
    name: test (fast required)
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # Coverage sources (testo_core + testo_api, line + branch) and the 65%
      # gate come from pytest.ini; measuring costs ~15 s on this suite.
      - name: Run fast required suite (with coverage gate)
        run: python -m pytest -q -m "tier_fast and not quarantined" --maxfail=1 --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
      # frontend/openapi.json is the contract the React app's types are
      # generated from; fail if a Pydantic model changed without re-exporting.
      - name: OpenAPI schema up to date
        run: python scripts/export_openapi.py --check
      - name: Upload diagnostics artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-artifacts
          path: |
            .artifacts/e2e/**
            **/*.log
            **/*summary*.json
            **/*api*.json
            **/*.png

  frontend:
    name: frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generated API types up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/lib/api-schema.ts || {
            echo "::error::src/lib/api-schema.ts is stale. Run 'npm --prefix frontend run gen:api' and commit the result."
            exit 1
          }
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  changelog_required:
    name: changelog required
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md update
        run: |
          # No --depth here: a shallow fetch into this full clone cuts the base
          # branch's history, so `base...HEAD` finds no merge base once the base
          # has moved on (seen on fork pull requests).
          git fetch origin "${{ github.base_ref }}"
          changed_files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          echo "$changed_files"
          if echo "$changed_files" | grep -q '^CHANGELOG.md$'; then
            echo "CHANGELOG.md was updated."
            exit 0
          fi
          non_doc_changes=$(echo "$changed_files" | grep -vE '^(docs/|\.github/|.*\.md$)' || true)
          if [ -z "$non_doc_changes" ]; then
            echo "No non-doc changes in this PR; CHANGELOG.md update not required."
            exit 0
          fi
          echo "::error::This PR changes code but does not update CHANGELOG.md. Add an entry under [Unreleased], or apply the 'no-changelog' label if this change doesn't warrant one."
          exit 1

  docs_vault:
    name: docs vault lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Rules live in docs/CLAUDE.md: frontmatter, no broken links, no
      # wikilinks, no orphan notes. Stdlib only, so nothing to install.
      - name: Lint the vault
        if: github.event_name != 'pull_request'
        run: python scripts/docs_vault.py lint
      # On pull requests also require `updated` to move on every edited note.
      - name: Lint the vault (with updated-date check)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}"
          python scripts/docs_vault.py lint --base "origin/${{ github.base_ref }}"

  docs_site:
    name: docs site (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install MkDocs
        run: python -m pip install -e ".[docs]"
      - name: Build the site
        run: mkdocs build --strict

  getting_started:
    name: getting started (GitHub Action on the example)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      # The local copy of the action; it installs testo-core from PyPI, so this
      # checks the guide against the published release.
      - id: testo
        uses: ./integrations/github-action
        with:
          config-path: examples/getting-started/testosterone.yaml
          cycle: unit
          python-version: "3.11"
      - name: Check the action's outputs
        run: test "${{ steps.testo.outputs.status }}" = success

  github_action:
    name: github action (this checkout, PR comment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      # Two runs, so the second summary has a previous run to compare with.
      - uses: ./integrations/github-action
        with:
          package: .
          config-path: examples/getting-started/testosterone.yaml
          cycle: unit
          job-summary: "false"
      - id: testo
        uses: ./integrations/github-action
        with:
          package: .
          config-path: examples/getting-started/testosterone.yaml
          cycle: unit
          comment-on-pr: "true"
      - name: Check the action's outputs
        run: test "${{ steps.testo.outputs.status }}" = success

  package:
    name: package (build + clean install)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: Check distribution metadata
        run: twine check --strict dist/*
      - name: Install the wheel with no extras and run a cycle
        run: bash scripts/package_smoke.sh dist

  deploy:
    name: deploy (build wheel)
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
      # Real publishing (PyPI via OIDC trusted publishing, Docker image to GHCR)
      # is handled by the Sprint 4 publish workflows from PR #38. Wire those in
      # here as additional steps/jobs once that PR lands on main.
