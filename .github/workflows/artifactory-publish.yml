name: Publish to JFrog Artifactory

# Mirrors the public release (PyPI + GHCR) into JFrog Artifactory.
#
# Inert until configured: every job is gated on the repository variable
# ARTIFACTORY_URL, so this workflow no-ops instead of failing a release while
# the Artifactory repos are still being provisioned.
#
# Required repository variables:
#   ARTIFACTORY_URL          e.g. https://acme.jfrog.io
#   ARTIFACTORY_PYPI_REPO    e.g. testo-pypi-local
#   ARTIFACTORY_DOCKER_REPO  e.g. testo-docker-local
#   ARTIFACTORY_DOCKER_HOST  e.g. acme.jfrog.io  (Docker registry hostname)
# Required repository secrets:
#   ARTIFACTORY_USERNAME
#   ARTIFACTORY_TOKEN        identity token (not a password)
#
# See docs/Processes & Guides/Publishing to Artifactory.md

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true

permissions:
  contents: read

jobs:
  pypi:
    name: Upload wheel and sdist
    if: vars.ARTIFACTORY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload to Artifactory
        env:
          TWINE_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.ARTIFACTORY_TOKEN }}
          TWINE_REPOSITORY_URL: ${{ vars.ARTIFACTORY_URL }}/artifactory/api/pypi/${{ vars.ARTIFACTORY_PYPI_REPO }}
        run: twine upload --non-interactive dist/*

      - name: Verify install from Artifactory
        env:
          INDEX: ${{ vars.ARTIFACTORY_URL }}/artifactory/api/pypi/${{ vars.ARTIFACTORY_PYPI_REPO }}/simple
        run: |
          python -m pip install \
            --index-url "https://${{ secrets.ARTIFACTORY_USERNAME }}:${{ secrets.ARTIFACTORY_TOKEN }}@${INDEX#https://}" \
            --extra-index-url https://pypi.org/simple/ \
            testo-core==${{ steps.version.outputs.version }}
          testo --version

  docker:
    name: Push runner image
    if: vars.ARTIFACTORY_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name || inputs.version }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Log in to Artifactory
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.ARTIFACTORY_DOCKER_HOST }}
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.testo-runner
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.ARTIFACTORY_DOCKER_HOST }}/${{ vars.ARTIFACTORY_DOCKER_REPO }}/testo-runner:${{ steps.version.outputs.version }}
            ${{ vars.ARTIFACTORY_DOCKER_HOST }}/${{ vars.ARTIFACTORY_DOCKER_REPO }}/testo-runner:latest
          build-args: |
            TESTO_VERSION=${{ steps.version.outputs.version }}
            TESTO_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          docker run --rm \
            ${{ vars.ARTIFACTORY_DOCKER_HOST }}/${{ vars.ARTIFACTORY_DOCKER_REPO }}/testo-runner:${{ steps.version.outputs.version }} \
            run --help
