name: nightly-external

# Real-provider lifecycle suite (tier_external): provisions and tears down
# throwaway GitHub/GitLab resources. It needs TESTO_E2E_* repository secrets;
# without them the job skips with a notice instead of failing every night.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: external-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  external_nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTO_E2E_EXTERNAL_DRY_RUN: "false"
      TESTO_E2E_GITHUB_TOKEN: ${{ secrets.TESTO_E2E_GITHUB_TOKEN }}
      TESTO_E2E_GITHUB_OWNER: ${{ secrets.TESTO_E2E_GITHUB_OWNER }}
      TESTO_E2E_GITLAB_TOKEN: ${{ secrets.TESTO_E2E_GITLAB_TOKEN }}
      TESTO_E2E_GITLAB_GROUP_ID: ${{ secrets.TESTO_E2E_GITLAB_GROUP_ID }}
      TESTO_E2E_GITLAB_BASE_URL: ${{ secrets.TESTO_E2E_GITLAB_BASE_URL }}
    steps:
      # Each provider test skips itself when its credentials are missing, so
      # the suite only has real work to do when at least one pair is set.
      - name: Check provider secrets are configured
        id: gate
        run: |
          if { [ -n "$TESTO_E2E_GITHUB_TOKEN" ] && [ -n "$TESTO_E2E_GITHUB_OWNER" ]; } ||
             { [ -n "$TESTO_E2E_GITLAB_TOKEN" ] && [ -n "$TESTO_E2E_GITLAB_GROUP_ID" ]; }; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No TESTO_E2E_GITHUB_* or TESTO_E2E_GITLAB_* secret pair is set; skipping the external suite."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.enabled == 'true'
        with:
          python-version: "3.11"
      - name: Install dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # --no-cov: this selects only a few tests, so pytest.ini's project-wide
      # coverage gate would fail the run whatever the results. Coverage is
      # enforced on the fast suite in ci.yml.
      - name: Run external lifecycle suite
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pytest -q -m "tier_external and cleanup_required" --maxfail=1 --durations=50 --no-cov
      - name: Upload diagnostics artifacts
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: nightly-external-artifacts
          path: |
            .artifacts/e2e/**
            **/*.log
            **/*summary*.json
            **/*api*.json
            **/*.png
