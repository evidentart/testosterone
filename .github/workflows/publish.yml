name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v1.1.1)"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Resolve version from tag
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Build package
        run: python -m build

      - name: Check the tag matches the package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pkg="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$pkg" != "$VERSION" ]; then
            echo "::error::release tag v$VERSION does not match pyproject.toml version $pkg"
            exit 1
          fi

      - name: Check distribution metadata
        run: twine check --strict dist/*

      - name: Install the wheel with no extras and run a cycle
        run: bash scripts/package_smoke.sh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Verify install from PyPI
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sleep 30
          python -m pip install "testo-core==$VERSION"
          testo --version
